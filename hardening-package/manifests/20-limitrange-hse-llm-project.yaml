apiVersion: v1
kind: LimitRange
metadata:
  name: default-workload-limits
  namespace: hse-llm-project
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
        ephemeral-storage: 256Mi
      default:
        cpu: "1"
        memory: 1Gi
        ephemeral-storage: 2Gi
      min:
        cpu: 25m
        memory: 64Mi
      max:
        cpu: "8"
        memory: 16Gi

