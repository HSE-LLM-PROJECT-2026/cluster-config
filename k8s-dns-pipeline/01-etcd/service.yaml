apiVersion: v1
kind: Service
metadata:
  name: dns-etcd
  namespace: kube-system
  labels:
    app.kubernetes.io/name: dns-etcd
    app.kubernetes.io/component: dns-storage
    app.kubernetes.io/managed-by: dns-pipeline
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dns-etcd
  ports:
    - name: client
      protocol: TCP
      port: 2379
      targetPort: 2379
    - name: peer
      protocol: TCP
      port: 2380
      targetPort: 2380
