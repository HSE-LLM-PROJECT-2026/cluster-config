apiVersion: v1
kind: Service
metadata:
  name: external-coredns
  namespace: kube-system
  labels:
    app.kubernetes.io/name: external-coredns
    app.kubernetes.io/component: dns-authoritative
    app.kubernetes.io/managed-by: dns-pipeline
  annotations:
    metallb.universe.tf/loadBalancerIPs: "10.42.0.10"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: external-coredns
  ports:
    - name: dns-udp
      protocol: UDP
      port: 53
      targetPort: 53
    - name: dns-tcp
      protocol: TCP
      port: 53
      targetPort: 53
