apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-coredns
  namespace: kube-system
  labels:
    app.kubernetes.io/name: external-coredns
    app.kubernetes.io/component: dns-authoritative
    app.kubernetes.io/managed-by: dns-pipeline
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: external-coredns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: external-coredns
        app.kubernetes.io/component: dns-authoritative
        app.kubernetes.io/managed-by: dns-pipeline
    spec:
      containers:
        - name: coredns
          image: coredns/coredns:1.11.1
          imagePullPolicy: IfNotPresent
          args:
            - -conf
            - /etc/coredns/Corefile
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: ready
              containerPort: 8181
              protocol: TCP
            - name: health
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: 8181
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
          volumeMounts:
            - name: config-volume
              mountPath: /etc/coredns
              readOnly: true
      volumes:
        - name: config-volume
          configMap:
            name: external-coredns
