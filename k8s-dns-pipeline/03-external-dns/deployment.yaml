apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
  namespace: kube-system
  labels:
    app.kubernetes.io/name: external-dns
    app.kubernetes.io/component: dns-controller
    app.kubernetes.io/managed-by: dns-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: external-dns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: external-dns
        app.kubernetes.io/component: dns-controller
        app.kubernetes.io/managed-by: dns-pipeline
    spec:
      serviceAccountName: external-dns
      containers:
        - name: external-dns
          image: registry.k8s.io/external-dns/external-dns:v0.14.2
          imagePullPolicy: IfNotPresent
          args:
            - --provider=coredns
            - --coredns-prefix=/skydns
            - --source=gateway-httproute
            - --source=service
            - --domain-filter=hse-llm-project-2026.ru
            - --registry=noop
            - --policy=upsert-only
            - --log-level=info
          env:
            - name: ETCD_URLS
              value: http://$(DNS_ETCD_SERVICE_HOST):2379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
